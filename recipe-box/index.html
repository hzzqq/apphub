<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>菜谱收藏盒</title>
<style>
:root{--bg:#0f0f23;--card:#1a1a2e;--card2:#221a3a;--txt:#e6e6f0;--sub:#8a8a9a;--line:#2a2a44;--accent:#667eea;--accent2:#764ba2;--up:#ff4d4f;--down:#00d486;}
*{box-sizing:border-box}
body{margin:0;font-family:system-ui,-apple-system,"Segoe UI",Roboto,"Microsoft YaHei",sans-serif;background:var(--bg);color:var(--txt);line-height:1.6;min-height:100vh}
a{color:var(--txt);text-decoration:none}
.hubhome{position:fixed;top:14px;left:14px;z-index:50;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:8px 12px;font-size:14px;cursor:pointer;box-shadow:0 4px 12px rgba(0,0,0,.4)}
.wrap{max-width:900px;margin:0 auto;padding:70px 16px 40px}
.head h1{font-size:26px;margin:0;background:linear-gradient(90deg,var(--accent),var(--accent2));-webkit-background-clip:text;color:transparent}
.head p{color:var(--sub);margin:8px 0 24px}
.filters{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}
.tag{background:var(--card2);border:1px solid var(--line);padding:6px 14px;border-radius:20px;font-size:13px;cursor:pointer}
.tag.on{background:var(--accent);border-color:var(--accent);color:#fff}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:14px}
.recipe{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;cursor:pointer;transition:.15s}
.recipe:hover{border-color:var(--accent)}
.recipe .emoji{font-size:32px}
.recipe .name{font-weight:700;margin-top:8px}
.recipe .meta{font-size:12px;color:var(--sub);margin-top:4px}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.7);display:none;place-items:center;z-index:60;padding:20px}
.modal.on{display:grid}
.modal .box{background:var(--card);border:1px solid var(--line);border-radius:16px;max-width:560px;width:100%;max-height:80vh;overflow:auto;padding:20px}
.modal h2{margin:0 0 10px}
.modal .close{float:right;background:var(--card2);border:1px solid var(--line);color:var(--txt);border-radius:8px;padding:4px 10px;cursor:pointer}
.inputrow{display:flex;gap:8px;margin-bottom:12px}
.inputrow input,.inputrow textarea{flex:1;background:var(--card2);border:1px solid var(--line);color:var(--txt);padding:10px 12px;border-radius:10px;outline:none}
.inputrow textarea{min-height:80px}
.btn{background:linear-gradient(90deg,var(--accent),var(--accent2));border:none;color:#fff;padding:10px 18px;border-radius:10px;cursor:pointer;font-weight:600}
.btn.ghost{background:var(--card2);border:1px solid var(--line);color:var(--txt)}
.hubfoot{margin-top:30px;border-top:1px solid var(--line);padding-top:14px;display:flex;justify-content:space-between;font-size:12px;color:var(--sub)}
</style>
</head>
<body>
<a class="hubhome" aria-label="返回 App 大厅" href="../index.html">🏠 大厅</a>
<div class="wrap">
  <div class="head"><h1>🍳 菜谱收藏盒</h1><p>记录喜欢的菜谱，按食材与口味快速查找</p></div>
  <div class="filters" id="filters"></div>
  <div class="inputrow">
    <input id="search" placeholder="搜索菜名或食材">
    <button class="btn" id="addBtn">+ 添加菜谱</button>
  </div>
  <div class="grid" id="grid"></div>
  <div class="hubfoot">
    <a href="../index.html">← 返回应用大厅</a>
    <span>数据存 localStorage</span>
  </div>
</div>
<div class="modal" id="modal">
  <div class="box">
    <button class="close" id="del" style="color:var(--up)">删除</button>
    <button class="close" id="close">关闭</button>
    <h2 id="mTitle">菜谱</h2>
    <p style="color:var(--sub);font-size:13px" id="mMeta"></p>
    <h4 style="margin:14px 0 6px">食材</h4>
    <p id="mIng" style="font-size:14px"></p>
    <h4 style="margin:14px 0 6px">步骤</h4>
    <ol id="mSteps" style="font-size:14px;padding-left:18px"></ol>
  </div>
</div>
<script>
function esc(s){return String(s==null?"":s).replace(/[&<>"']/g,function(c){return({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]);});}
function safeUrl(u){u=String(u==null?"":u);if(/^\s*javascript:/i.test(u))return"#";return esc(u);}

const KEY="recipe_data";
const TAGS=["全部","家常菜","快手菜","汤羹","烘焙","减脂","川菜","粤菜"];
let recipes=JSON.parse(localStorage.getItem(KEY)||"null");
if(!recipes){
  recipes=[
    {id:1,name:"番茄炒蛋",emoji:"🍅",tag:"家常菜",time:"10分钟",ing:"番茄2个、鸡蛋3个、葱花、盐、糖",steps:["番茄切块，鸡蛋打散","热油炒蛋盛出","炒番茄出汁，倒入鸡蛋","调味撒葱花出锅"]},
    {id:2,name:"蒜蓉西兰花",emoji:"🥦",tag:"减脂",time:"8分钟",ing:"西兰花1颗、大蒜、生抽、蚝油",steps:["西兰花焯水备用","爆香蒜末","下西兰花翻炒","加生抽蚝油炒匀"]},
    {id:3,name:"可乐鸡翅",emoji:"🍗",tag:"家常菜",time:"25分钟",ing:"鸡翅10个、可乐1罐、姜片、生抽、老抽",steps:["鸡翅划刀焯水","煎至两面金黄","加可乐和调料","小火收汁"]},
    {id:4,name:"紫菜蛋花汤",emoji:"🍲",tag:"汤羹",time:"5分钟",ing:"紫菜、鸡蛋1个、虾皮、盐、香油",steps:["水烧开下紫菜虾皮","倒入蛋液搅散","加盐香油调味"]},
  ];
}
let curTag="全部",curQ="",curModalId=null;
function save(){localStorage.setItem(KEY,JSON.stringify(recipes));render();}
function renderFilters(){
  document.getElementById("filters").innerHTML=TAGS.map(t=>`<span class="tag ${t===curTag?'on':''}" data-t="${t}">${t}</span>`).join("");
  document.querySelectorAll(".tag").forEach(el=>el.addEventListener("click",()=>{curTag=el.dataset.t;render();}));
}
function render(){
  renderFilters();
  const q=curQ.trim().toLowerCase();
  const list=recipes.filter(r=>(curTag==="全部"||r.tag===curTag)&&(!q||r.name.includes(q)||r.ing.toLowerCase().includes(q)));
  document.getElementById("grid").innerHTML=list.map(r=>`
    <div class="recipe" data-id="${r.id}">
      <div class="emoji">${r.emoji}</div>
      <div class="name">${esc(r.name)}</div>
      <div class="meta">${esc(r.tag)} · ${esc(r.time)}</div>
    </div>
  `).join("")||'<div style="color:var(--sub);grid-column:1/-1;text-align:center">暂无匹配菜谱</div>';
  document.querySelectorAll(".recipe").forEach(el=>el.addEventListener("click",()=>openModal(+el.dataset.id)));
}
function openModal(id){
  const r=recipes.find(x=>x.id===id); if(!r)return;
  curModalId=id;
  document.getElementById("mTitle").textContent=r.emoji+" "+r.name;
  document.getElementById("mMeta").textContent=r.tag+" · "+r.time;
  document.getElementById("mIng").textContent=r.ing;
  document.getElementById("mSteps").innerHTML=r.steps.map(s=>`<li>${esc(s)}</li>`).join("");
  document.getElementById("modal").classList.add("on");
}
document.getElementById("close").addEventListener("click",()=>document.getElementById("modal").classList.remove("on"));
document.getElementById("del").addEventListener("click",()=>{
  if(curModalId==null)return;
  if(confirm("确定删除该菜谱？")){ recipes=recipes.filter(r=>r.id!==curModalId); curModalId=null; save(); document.getElementById("modal").classList.remove("on"); }
});
document.getElementById("modal").addEventListener("click",e=>{if(e.target.id==="modal")document.getElementById("modal").classList.remove("on");});
document.getElementById("search").addEventListener("input",e=>{curQ=e.target.value;render();});
document.getElementById("addBtn").addEventListener("click",()=>{
  const name=prompt("菜名"); if(!name)return;
  const tag=prompt("分类（家常菜/快手菜/汤羹/烘焙/减脂/川菜/粤菜）","家常菜");
  const ing=prompt("食材"); const steps=prompt("步骤，用逗号分隔");
  recipes.push({id:Date.now(),name,emoji:"🍽️",tag:tag||"家常菜",time:"自定义",ing:ing||"",steps:(steps||"").split(",")});
  save();
});
render();
</script>
</body>
</html>
