name: verify

# App Hub 12 维门禁：push / PR / 手动触发时自动跑 verify_all.py
on:
  push:
    branches: [ master ]
  pull_request:
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install backend deps
        run: pip install flask
      - name: Run 12-gate verification
        run: python verify_all.py
