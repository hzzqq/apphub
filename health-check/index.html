<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>健康体检单 · 个人/品牌</title>
<style>
  :root{
    --bg:#0f0f23; --card:#1a1a2e; --card2:#221a3a; --line:#2e2b45;
    --txt:#e6e6f0; --sub:#9a9ab0; --up:#ff4d4f; --down:#00d486; --purple:#667eea; --gold:#f6c453;
  }
  *{box-sizing:border-box}
  body{margin:0;background:linear-gradient(160deg,#0f0f23,#15132b);color:var(--txt);
    font-family:-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;padding:18px;max-width:760px;margin:0 auto}
  h1{font-size:20px;margin:0 0 4px;background:linear-gradient(90deg,#667eea,#764ba2);
    -webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}
  .sub{color:var(--sub);font-size:13px;margin-bottom:14px}
  .card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px;margin:14px 0}
  .grp{margin:16px 0}
  .grp h3{font-size:15px;margin:0 0 8px;color:var(--purple)}
  .item{display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid var(--line)}
  .item:last-child{border-bottom:none}
  .item label{flex:1;font-size:14px}
  .item .opt{display:flex;gap:6px}
  .item .opt button{background:var(--card2);border:1px solid var(--line);color:var(--sub);
    border-radius:7px;padding:5px 12px;cursor:pointer;font-size:13px}
  .item .opt button.on.y{background:rgba(0,212,134,.2);color:var(--down);border-color:var(--down)}
  .item .opt button.on.n{background:rgba(255,77,79,.2);color:var(--up);border-color:var(--up)}
  .item .opt button.on.p{background:rgba(246,196,83,.2);color:var(--gold);border-color:var(--gold)}
  .score{font-size:40px;font-weight:700;text-align:center;margin:10px 0}
  .score small{font-size:14px;color:var(--sub);font-weight:400}
  .bar{height:12px;background:var(--card2);border-radius:8px;overflow:hidden;margin:8px 0}
  .bar i{display:block;height:100%;background:linear-gradient(90deg,#667eea,#764ba2)}
  .btn{background:linear-gradient(90deg,#667eea,#764ba2);color:#fff;border:none;border-radius:9px;padding:9px 16px;cursor:pointer;font-size:14px}
  .btn.ghost{background:var(--card2);border:1px solid var(--line);color:var(--txt)}
  .diag{margin-top:10px;font-size:13.5px;line-height:1.6;color:var(--txt)}
  .diag b{color:var(--gold)}
  footer{color:var(--sub);font-size:12px;text-align:center;margin-top:18px}

  .hubfoot{max-width:1180px;margin:30px auto 0;padding:16px;text-align:center;
    font-size:12px;color:var(--sub);border-top:1px solid var(--line);line-height:1.8}
  .hubfoot a{color:var(--g1);text-decoration:none;font-weight:600}
  .hubfoot a:hover{text-decoration:underline}

  .hubhome{position:fixed;top:14px;right:14px;z-index:90;background:linear-gradient(135deg,#667eea,#764ba2);color:#fff;text-decoration:none;border-radius:10px;padding:8px 12px;font-size:13px;font-weight:600;box-shadow:0 4px 14px rgba(124,92,255,.35);transition:filter .15s}
  .hubhome:hover{filter:brightness(1.12)}
  @media (max-width:600px){
    body{padding:12px}
    h1{font-size:18px}
    .card{padding:12px;margin:10px 0}
    .item label{font-size:13px}
    .item .opt button{padding:5px 9px;font-size:12px}
    .score{font-size:34px}
  }
</style>
</head>
<body>
  <a class="hubhome" aria-label="返回 App 大厅" href="../index.html" title="返回 App 大厅">🏠 大厅</a>

  <h1>🩺 健康体检单</h1>
  <div class="sub">一页式个人 / 品牌自检清单 · 源自 personal company「HEALTH / reportio」逻辑 · 零依赖</div>

  <div class="card">
    <div class="toolbar" style="display:flex;gap:8px;margin-bottom:10px">
      <button class="btn ghost" id="modeP">👤 个人健康</button>
      <button class="btn ghost" id="modeB">🏷️ 品牌健康</button>
      <button class="btn ghost" id="resetBtn">↺ 重置</button>
    </div>
    <div id="form"></div>
    <div style="text-align:center;margin-top:14px">
      <button class="btn" id="calcBtn">计算体检得分</button>
    </div>
    <div class="score" id="scoreBox" style="display:none"></div>
    <div class="bar" id="barBox" style="display:none"><i id="barFill"></i></div>
    <div class="diag" id="diagBox"></div>
  </div>
  <footer>双击即用的零依赖小工具 · 自检清单仅供参考，不替代专业诊断/商业尽调</footer>

<script>
const TPL={
  person:[
    {g:"身体",items:["规律作息(23点前睡)","每周运动≥3次","饮食均衡少外卖","年度体检已做","无长期不适"]},
    {g:"心理",items:["情绪总体稳定","有可倾诉的人","工作压力可控","有放松爱好"]},
    {g:"财务",items:["有应急储蓄(≥3月开支)","无高息负债","有记账/预算习惯","有保险保障"]},
    {g:"关系",items:["家庭关系和睦","有深度友谊","职场人际正常"]},
  ],
  brand:[
    {g:"定位",items:["价值主张清晰","目标用户明确","差异化可感知","品牌名易记"]},
    {g:"内容",items:["更新稳定","内容有辨识度","用户互动率高","视觉统一"]},
    {g:"增长",items:["获客渠道≥2个","有复购/留存","口碑转介绍存在","数据可追踪"]},
    {g:"经营",items:["现金流为正/可控","团队稳定","合规无风险","有迭代节奏"]},
  ]
};
let cur="person";
let state={}; // id-> y/n/p
try{ state=JSON.parse(localStorage.getItem("hc_health_state")||"{}")||{}; }catch(e){ state={}; }
function persist(){ try{ localStorage.setItem("hc_health_state",JSON.stringify(state)); }catch(e){} }
function hideScore(){ document.getElementById("scoreBox").style.display="none";document.getElementById("barBox").style.display="none";document.getElementById("diagBox").innerHTML=""; }

function renderForm(){
  const tpl=TPL[cur];
  const box=document.getElementById("form");
  box.innerHTML=tpl.map((grp,gi)=>{
    return `<div class="grp"><h3>${grp.g}</h3>`+grp.items.map((it,ii)=>{
      const id=cur+gi+"_"+ii;
      const v=state[id]||"";
      return `<div class="item">
        <label>${it}</label>
        <div class="opt">
          <button class="${v==='y'?'on y':''}" data-id="${id}" data-v="y">是</button>
          <button class="${v==='p'?'on p':''}" data-id="${id}" data-v="p">部分</button>
          <button class="${v==='n'?'on n':''}" data-id="${id}" data-v="n">否</button>
        </div>
      </div>`;
    }).join("")+`</div>`;
  }).join("");
  box.querySelectorAll(".opt button").forEach(b=>b.addEventListener("click",()=>{
    const id=b.dataset.id,v=b.dataset.v;
    if(state[id]===v)delete state[id]; else state[id]=v;
    persist(); renderForm();
  }));
}
function calc(){
  const tpl=TPL[cur];
  let total=0,done=0;
  tpl.forEach((grp,gi)=>grp.items.forEach((it,ii)=>{
    const v=state[cur+gi+"_"+ii]; if(!v)return; done++;
    total += v==="y"?1 : v==="p"?0.5 : 0;
  }));
  const all=tpl.reduce((s,g)=>s+g.items.length,0);
  const pct=Math.round(total/all*100);
  const sb=document.getElementById("scoreBox");
  sb.style.display="block";
  sb.innerHTML=pct+' <small>/ 100 分（已答 '+done+'/'+all+' 项）</small>';
  const bar=document.getElementById("barBox"); bar.style.display="block";
  document.getElementById("barFill").style.width=pct+"%";
  let diag="";
  if(pct>=80)diag='<b>状态良好 ✅</b>：大部分维度达标，保持节奏即可。';
  else if(pct>=60)diag='<b>基本健康 ⚠️</b>：整体过得去，但有短板需补强（看"否/部分"项）。';
  else if(pct>=40)diag='<b>需要关注 🔧</b>：多个维度偏弱，建议优先处理连续的"否"。';
  else diag='<b>亮红灯 🚨</b>：健康度偏低，建议从最关键的 1-2 项开始系统性改善。';
  const weak=tpl.flatMap((grp,gi)=>grp.items.map((it,ii)=>({it,grp:grp.g,v:state[cur+gi+"_"+ii]})))
    .filter(x=>x.v==="n"||x.v==="p").map(x=>`${x.grp}·${x.it}`).slice(0,5);
  if(weak.length)diag+='<br>建议优先改善：'+weak.map(w=>'「'+w+'」').join("、");
  document.getElementById("diagBox").innerHTML=diag;
}

document.getElementById("modeP").addEventListener("click",()=>{cur="person";renderForm();hideScore();});
document.getElementById("modeB").addEventListener("click",()=>{cur="brand";renderForm();hideScore();});
document.getElementById("resetBtn").addEventListener("click",()=>{ if(confirm("清空当前所有勾选？")){ state={}; persist(); renderForm(); hideScore(); } });
document.getElementById("calcBtn").addEventListener("click",calc);

renderForm();
</script>

  <footer class="hubfoot">
    <a href="../index.html">← 返回 App 大厅</a> &nbsp;·&nbsp;
    <span>数据来自公开接口或本地演示，仅供学习与参考，不构成任何投资建议。</span>
  </footer>
</body>
</html>
