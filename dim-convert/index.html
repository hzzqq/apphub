<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>2D⇄3D 互转台</title>
<style>
:root{
  --bg:#0B0B0F; --card:#14141B; --card2:#1B1B24; --line:rgba(255,255,255,.09);
  --txt:#F5F5F7; --sub:#A1A1AA; --accent:#7c5cff; --accent2:#667eea;
}
*{box-sizing:border-box}
body{margin:0;font-family:system-ui,-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;
  background:var(--bg);color:var(--txt);line-height:1.5;min-height:100vh;-webkit-font-smoothing:antialiased}
a{color:var(--txt);text-decoration:none}
.hubhome{position:fixed;top:14px;left:14px;z-index:50;background:var(--card);border:1px solid var(--line);
  border-radius:10px;padding:8px 12px;font-size:14px;cursor:pointer;box-shadow:0 4px 12px rgba(0,0,0,.4)}
.wrap{max-width:1080px;margin:0 auto;padding:64px 16px 48px}
.head{text-align:center;margin-bottom:16px}
.head h1{font-size:26px;margin:0;background:linear-gradient(90deg,var(--accent),var(--accent2));
  -webkit-background-clip:text;background-clip:text;color:transparent}
.head p{color:var(--sub);margin:6px 0 0;font-size:13px}
.tabs{display:flex;gap:8px;justify-content:center;margin-bottom:14px}
.tab{background:var(--card2);border:1px solid var(--line);color:var(--sub);border-radius:10px;
  padding:9px 16px;cursor:pointer;font-weight:600;font-size:13px}
.tab.active{border-color:var(--accent);color:#fff;background:linear-gradient(90deg,var(--accent),var(--accent2))}
.panel{display:grid;grid-template-columns:340px 1fr;gap:18px;align-items:start}
@media(max-width:820px){.panel{grid-template-columns:1fr}}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px;margin-bottom:14px}
.card h2{font-size:14px;margin:0 0 12px;color:var(--sub);letter-spacing:.04em;font-weight:600}
.row{display:flex;gap:10px;align-items:center;margin-bottom:12px;flex-wrap:wrap}
.btn{background:linear-gradient(90deg,var(--accent),var(--accent2));border:none;color:#fff;
  padding:9px 14px;border-radius:10px;cursor:pointer;font-weight:600;font-size:13px}
.btn.ghost{background:var(--card2);border:1px solid var(--line);color:var(--txt)}
.btn.sm{padding:6px 10px;font-size:12px}
input[type=range]{flex:1;accent-color:var(--accent)}
.lbl{font-size:12px;color:var(--sub);min-width:64px}
.val{font-size:12px;color:var(--txt);min-width:34px;text-align:right;font-variant-numeric:tabular-nums}
#view{width:100%;height:520px;background:#0b0b0f;border:1px solid var(--line);border-radius:16px;overflow:hidden;position:relative;cursor:grab}
#view:active{cursor:grabbing}
.hint{font-size:12px;color:var(--sub);margin-top:8px;line-height:1.6}
.bar{display:flex;gap:10px;flex-wrap:wrap;margin-top:4px}
#status{font-size:12px;color:var(--sub);margin-top:10px;min-height:18px}
.tag{display:inline-block;font-size:11px;padding:2px 8px;border-radius:999px;background:var(--card2);
  border:1px solid var(--line);color:var(--sub);margin-left:8px}
</style>
</head>
<body>
<a class="hubhome" href="../index.html">← 返回大厅</a>
<div class="wrap">
  <div class="head">
    <h1>2D⇄3D 互转台</h1>
    <p>图片 → 3D 浮雕 · 3D 场景 → 导出 2D 视图<span class="tag">纯前端 · 零依赖 · 无 CDN</span></p>
  </div>

  <div class="tabs">
    <div class="tab active" id="tabRelief">2D → 3D 浮雕</div>
    <div class="tab" id="tabModel">3D → 2D 导出</div>
  </div>

  <div class="panel">
    <div>
      <div class="card" id="paneRelief">
        <h2>上传图片生成 3D 浮雕</h2>
        <div class="row">
          <input type="file" id="imgUpload" accept="image/*">
        </div>
        <div class="row">
          <span class="lbl">网格精度</span>
          <input type="range" id="res" min="24" max="120" value="56">
          <span class="val" id="resV">56</span>
        </div>
        <div class="row">
          <span class="lbl">浮雕强度</span>
          <input type="range" id="strength" min="0.1" max="3" step="0.1" value="1.2">
          <span class="val" id="strV">1.2</span>
        </div>
        <div class="hint">亮度越高的像素凸起越高，图片会作为颜色包裹在浮雕表面。生成后可拖拽旋转、滚轮缩放。</div>
      </div>

      <div class="card" id="paneModel" style="display:none">
        <h2>加载 3D 模型导出视图</h2>
        <div class="row">
          <input type="file" id="objUpload" accept=".obj">
        </div>
        <div class="hint">支持 .obj 格式（含 v / f 顶点与面）。加载后进入 3D 场景，可拖拽旋转并从右侧导出 PNG。</div>
      </div>

      <div class="card">
        <h2>导出</h2>
        <div class="bar">
          <button class="btn sm" id="btnSample">载入示例模型</button>
          <button class="btn sm" id="btnExp1">导出当前视图 PNG</button>
          <button class="btn ghost sm" id="btnExp4">导出四视角 PNG</button>
        </div>
        <div id="status">正在初始化渲染引擎…</div>
      </div>
    </div>

    <div id="view"></div>
  </div>
</div>

<script>
(function(){
  'use strict';
  var $ = function(id){ return document.getElementById(id); };
  var statusEl = $('status');
  function setStatus(t){ if(statusEl) statusEl.textContent = t; }

  var cv, ctx, W = 800, H = 520;
  var yaw = 0.7, pitch = 0.35, dist = 6.2, zoom = 1;
  var mesh = null;
  var dragging = false, lx = 0, ly = 0;

  function norm(v){
    var l = Math.sqrt(v[0]*v[0] + v[1]*v[1] + v[2]*v[2]) || 1;
    return [v[0]/l, v[1]/l, v[2]/l];
  }
  function rot(p){
    var cy = Math.cos(yaw), sy = Math.sin(yaw);
    var x1 = p[0]*cy + p[2]*sy;
    var z1 = -p[0]*sy + p[2]*cy;
    var cx = Math.cos(pitch), sx = Math.sin(pitch);
    var y1 = p[1]*cx - z1*sx;
    var z2 = p[1]*sx + z1*cx;
    return [x1, y1, z2];
  }
  function project(p){
    var r = rot(p);
    var z = r[2] + dist;
    if(z < 0.1) z = 0.1;
    var f = 520 * zoom / z;
    return { x: W/2 + r[0]*f, y: H/2 - r[1]*f, z: r[2] };
  }

  function render(){
    if(!ctx) return;
    ctx.fillStyle = '#0b0b0f';
    ctx.fillRect(0, 0, W, H);
    if(!mesh) return;
    var vs = mesh.verts.map(rot);
    var pr = vs.map(project);
    var light = norm([-0.4, 0.75, 0.55]);
    var polys = [];
    for(var f = 0; f < mesh.faces.length; f++){
      var fc = mesh.faces[f];
      if(fc[0] >= vs.length || fc[1] >= vs.length || fc[2] >= vs.length) continue;
      var a = vs[fc[0]], b = vs[fc[1]], c = vs[fc[2]];
      var nx = (b[1]-a[1])*(c[2]-a[2]) - (b[2]-a[2])*(c[1]-a[1]);
      var ny = (b[2]-a[2])*(c[0]-a[0]) - (b[0]-a[0])*(c[2]-a[2]);
      var nz = (b[0]-a[0])*(c[1]-a[1]) - (b[1]-a[1])*(c[0]-a[0]);
      var len = Math.sqrt(nx*nx + ny*ny + nz*nz) || 1;
      var d = (nx*light[0] + ny*light[1] + nz*light[2]) / len;
      d = Math.max(0.18, Math.min(1, Math.abs(d)));
      var depth = (pr[fc[0]].z + pr[fc[1]].z + pr[fc[2]].z) / 3;
      polys.push({ fc: fc, depth: depth, shade: d, color: mesh.colors ? mesh.colors[f] : [124,92,255] });
    }
    polys.sort(function(p, q){ return p.depth - q.depth; });
    for(var i = 0; i < polys.length; i++){
      var P = polys[i], F = P.fc;
      var pa = pr[F[0]], pb = pr[F[1]], pc = pr[F[2]];
      if(pa.z < -dist || pb.z < -dist || pc.z < -dist) continue;
      ctx.beginPath();
      ctx.moveTo(pa.x, pa.y);
      ctx.lineTo(pb.x, pb.y);
      ctx.lineTo(pc.x, pc.y);
      ctx.closePath();
      var col = P.color;
      var r = (col[0]*P.shade)|0, g = (col[1]*P.shade)|0, b = (col[2]*P.shade)|0;
      ctx.fillStyle = 'rgb(' + r + ',' + g + ',' + b + ')';
      ctx.fill();
    }
  }

  function clearMesh(){ mesh = null; }

  function buildSample(){
    clearMesh();
    var segU = 44, segV = 22, R = 1.5, r = 0.55;
    var verts = [], faces = [], colors = [];
    for(var i = 0; i <= segU; i++){
      for(var j = 0; j <= segV; j++){
        var u = 2*Math.PI*i/segU, v = 2*Math.PI*j/segV;
        var rr = R + r*Math.cos(v);
        verts.push([rr*Math.cos(u), rr*Math.sin(u), r*Math.sin(v)]);
      }
    }
    function idx(i,j){ return i*(segV+1) + j; }
    for(var i2 = 0; i2 < segU; i2++){
      for(var j2 = 0; j2 < segV; j2++){
        var a = idx(i2,j2), b = idx(i2+1,j2), c = idx(i2+1,j2+1), d = idx(i2,j2+1);
        faces.push([a,b,c]); colors.push([124,92,255]);
        faces.push([a,c,d]); colors.push([124,92,255]);
      }
    }
    mesh = { verts: verts, faces: faces, colors: colors };
    yaw = 0.7; pitch = 0.35; dist = 6.2; zoom = 1;
    setStatus('已载入示例圆环模型 · 拖拽旋转 / 滚轮缩放 · 导出即得到 2D 图');
    render();
  }

  // 2D -> 3D 浮雕：图片亮度驱动位移，图片颜色包裹表面
  function buildRelief(img, N, strength){
    N = Math.max(16, Math.min(140, N|0));
    strength = strength || 1.2;
    var off = document.createElement('canvas'); off.width = 256; off.height = 192;
    var octx = off.getContext('2d');
    octx.drawImage(img, 0, 0, 256, 192);
    var data = octx.getImageData(0, 0, 256, 192).data;
    function sample(u, v){
      var x = Math.max(0, Math.min(255, (u*255)|0));
      var y = Math.max(0, Math.min(191, (v*191)|0));
      var i = ((y|0)*256 + (x|0))*4;
      var lum = (data[i] + data[i+1] + data[i+2]) / 765;
      return { lum: lum, col: [data[i], data[i+1], data[i+2]] };
    }
    var verts = [], faces = [], colors = [], heights = [];
    for(var i = 0; i <= N; i++){
      for(var j = 0; j <= N; j++){
        var u = i/N, v = j/N;
        var s = sample(u, v);
        var x = (u*4 - 2), y = (v*3 - 1.5);
        verts.push([x, y, s.lum * strength]);
        heights.push(s);
      }
    }
    function idx(i,j){ return i*(N+1) + j; }
    for(var i2 = 0; i2 < N; i2++){
      for(var j2 = 0; j2 < N; j2++){
        var a = idx(i2,j2), b = idx(i2+1,j2), c = idx(i2+1,j2+1), d = idx(i2,j2+1);
        var ca = heights[a].col, cb = heights[b].col, cc = heights[c].col, cd = heights[d].col;
        var avg = [ (ca[0]+cb[0]+cc[0]+cd[0])/4|0, (ca[1]+cb[1]+cc[1]+cd[1])/4|0, (ca[2]+cb[2]+cc[2]+cd[2])/4|0 ];
        faces.push([a,b,c]); colors.push(avg);
        faces.push([a,c,d]); colors.push(avg);
      }
    }
    mesh = { verts: verts, faces: faces, colors: colors };
    yaw = 0.5; pitch = 0.9; dist = 6.0; zoom = 1;
    setStatus('已生成浮雕模型 · 亮度越高凸起越高 · 拖拽旋转后导出 PNG 即完成 2D→3D→2D');
    render();
  }

  // 3D -> 2D 导出：解析 .obj 顶点/面
  function buildObj(text){
    var verts = [], faces = [], colors = [];
    var lines = text.split(/\r?\n/);
    for(var i = 0; i < lines.length; i++){
      var ln = lines[i].trim();
      if(ln.charAt(0) === 'v' && (ln.charAt(1) === ' ' || ln.charAt(1) === '\t')){
        var p = ln.slice(1).trim().split(/\s+/);
        if(p.length >= 3) verts.push([parseFloat(p[0]), parseFloat(p[1]), parseFloat(p[2])]);
      } else if(ln.charAt(0) === 'f' && (ln.charAt(1) === ' ' || ln.charAt(1) === '\t')){
        var toks = ln.slice(1).trim().split(/\s+/);
        var ids = [];
        for(var k = 0; k < toks.length; k++){
          var first = toks[k].split('/')[0];
          var n = parseInt(first, 10);
          if(!isNaN(n)) ids.push(n - 1);
        }
        if(ids.length >= 3){
          for(var t = 1; t < ids.length - 1; t++){
            faces.push([ids[0], ids[t], ids[t+1]]);
            colors.push([124, 92, 255]);
          }
        }
      }
    }
    if(!verts.length){ setStatus('⚠ 未解析到有效顶点'); return; }
    mesh = { verts: verts, faces: faces, colors: colors };
    yaw = 0.7; pitch = 0.35; dist = 6.2; zoom = 1;
    setStatus('已加载 OBJ 模型（' + verts.length + ' 顶点 / ' + faces.length + ' 面）· 拖拽旋转 · 导出 PNG');
    render();
  }

  function drawAt(azimuth){
    var baseY = 0.35;
    var cx = Math.sin(azimuth) * dist, cz = Math.cos(azimuth) * dist;
    var savedYaw = yaw, savedPitch = pitch;
    yaw = azimuth;
    pitch = baseY;
    render();
    yaw = savedYaw; pitch = savedPitch;
  }

  function exportPNG(multi){
    if(!mesh){ setStatus('⚠ 没有可导出的模型'); return; }
    render();
    if(!multi){
      downloadURI(cv.toDataURL('image/png'), 'view.png');
      return;
    }
    var size = 320;
    var out = document.createElement('canvas'); out.width = size*2; out.height = size*2;
    var octx = out.getContext('2d');
    var angles = [0, Math.PI/2, Math.PI, 3*Math.PI/2];
    angles.forEach(function(a, k){
      drawAt(a);
      var im = new Image();
      im.onload = function(){
        octx.drawImage(im, (k%2)*size, ((k/2)|0)*size, size, size);
        if(k === 3) downloadURI(out.toDataURL('image/png'), 'views4.png');
      };
      im.src = cv.toDataURL('image/png');
    });
  }

  function downloadURI(uri, name){
    var a = document.createElement('a');
    a.href = uri; a.download = name;
    document.body.appendChild(a); a.click(); a.remove();
  }

  function resize(){
    var view = $('view');
    if(!view || !cv) return;
    W = view.clientWidth || 800;
    H = view.clientHeight || 520;
    cv.width = W; cv.height = H;
    render();
  }

  function init(){
    var view = $('view');
    if(!view){ setStatus('⚠ 容器缺失'); return; }
    W = view.clientWidth || 800;
    H = view.clientHeight || 520;
    cv = document.createElement('canvas');
    cv.width = W; cv.height = H;
    cv.style.width = '100%'; cv.style.height = '100%';
    view.appendChild(cv);
    ctx = cv.getContext('2d');
    if(!ctx){ setStatus('⚠ 当前环境不支持 Canvas 2D'); return; }

    cv.addEventListener('mousedown', function(e){ dragging = true; lx = e.clientX; ly = e.clientY; });
    window.addEventListener('mouseup', function(){ dragging = false; });
    window.addEventListener('mousemove', function(e){
      if(!dragging) return;
      yaw += (e.clientX - lx) * 0.01;
      pitch += (e.clientY - ly) * 0.01;
      if(pitch > 1.5) pitch = 1.5; if(pitch < -1.5) pitch = -1.5;
      lx = e.clientX; ly = e.clientY;
      render();
    });
    cv.addEventListener('wheel', function(e){
      e.preventDefault();
      dist *= (1 + (e.deltaY > 0 ? 0.1 : -0.1));
      if(dist < 2) dist = 2; if(dist > 20) dist = 20;
      render();
    }, { passive: false });
    window.addEventListener('resize', resize);

    buildSample();
  }

  function wire(){
    var up = $('imgUpload');
    if(up) up.addEventListener('change', function(e){
      var f = e.target.files && e.target.files[0]; if(!f) return;
      var r = new FileReader();
      r.onload = function(ev){
        var im = new Image();
        im.onload = function(){
          var N = parseInt(($('res')||{}).value || '56', 10) || 56;
          var st = parseFloat(($('strength')||{}).value || '1.2') || 1.2;
          buildRelief(im, N, st);
        };
        im.src = ev.target.result;
      };
      r.readAsDataURL(f);
    });
    var ob = $('objUpload');
    if(ob) ob.addEventListener('change', function(e){
      var f = e.target.files && e.target.files[0]; if(!f) return;
      var r = new FileReader();
      r.onload = function(ev){ buildObj(ev.target.result); };
      r.readAsText(f);
    });
    var rs = $('res'); if(rs) rs.addEventListener('input', function(){ var v=$('resV'); if(v) v.textContent = rs.value; });
    var st = $('strength'); if(st) st.addEventListener('input', function(){ var v=$('strV'); if(v) v.textContent = st.value; });
    var b1 = $('btnSample'); if(b1) b1.addEventListener('click', buildSample);
    var b2 = $('btnExp1'); if(b2) b2.addEventListener('click', function(){ exportPNG(false); });
    var b4 = $('btnExp4'); if(b4) b4.addEventListener('click', function(){ exportPNG(true); });
    var tR = $('tabRelief'); if(tR) tR.addEventListener('click', function(){ setMode('relief'); });
    var tM = $('tabModel'); if(tM) tM.addEventListener('click', function(){ setMode('model'); });
  }

  function setMode(m){
    var r = $('paneRelief'), x = $('paneModel');
    if(r) r.style.display = (m === 'relief') ? 'block' : 'none';
    if(x) x.style.display = (m === 'model') ? 'block' : 'none';
    var t1 = $('tabRelief'), t2 = $('tabModel');
    if(t1) t1.classList.toggle('active', m === 'relief');
    if(t2) t2.classList.toggle('active', m === 'model');
  }

  if(typeof document !== 'undefined'){
    document.addEventListener('DOMContentLoaded', function(){
      wire();
      setMode('relief');
      init();
    });
  }
})();
</script>
</body>
</html>
