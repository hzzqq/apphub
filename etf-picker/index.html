  {code:"159995",name:"芯片ETF",type:"主题",industry:"半导体",size:240,ret:27.0,fee:0.5,trackErr:0.16,issuer:"华夏"},

const WATCH_KEY = "etf_watch_v1";
const FILTER_KEY = "etf_filters_v1";

// ---------- 纯工具函数（测试对象）----------

// HTML 转义：防 XSS 的基础层
function esc(s){
  return String(s==null?"":s)
    .replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;").replace(/'/g,"&#39;");
}

// 白名单富文本：先整体转义，再放开极少安全标签，杜绝脚本注入
// 允许的标签：b i u em strong br ；a 仅允许 http(s) 链接
const SAFE_TAG = /^(b|i|u|em|strong|br)$/;
function sanitizeHTML(input){
  if(input==null) return "";
  let s = esc(input);
  s = s.replace(/&lt;(b|i|u|em|strong|br)\s*&gt;/gi, "<$1>");
  s = s.replace(/&lt;\/(b|i|u|em|strong)\s*&gt;/gi, "</$1>");
  s = s.replace(/&lt;br\s*\/&gt;/gi, "<br>");
  // 安全链接：仅 http/https（注意属性引号已被转义为 &quot;）
  s = s.replace(/&lt;a\s+href=&quot;(https?:\/\/[^&]*?)&quot;\s*&gt;/gi, '<a href="$1" target="_blank" rel="noopener">');
  s = s.replace(/&lt;\/a&gt;/gi, "</a>");
  return s;
}

// 数值解析：非法返回 fallback
function asNum(v, d){
  const n = parseFloat(v);
  return isFinite(n) ? n : d;
}

// 归一化单条 ETF（容错）
function sanitizeETF(raw){
  raw = raw || {};
  return {
    code: String(raw.code==null?"":raw.code),
    name: String(raw.name==null?"":raw.name),
    type: String(raw.type==null?"":raw.type),
    industry: String(raw.industry==null?"":raw.industry),
    size: asNum(raw.size, 0),
    ret: asNum(raw.ret, 0),
    fee: asNum(raw.fee, 0),
    trackErr: asNum(raw.trackErr, 0),
    issuer: String(raw.issuer==null?"":raw.issuer)
  };
}

// 多维筛选（crit: {type,industry,minSize,minRet,maxRet,maxFee,maxTrack,kw,watchOnly}）
function filterETFs(list, crit, watchSet){
  crit = crit || {};
  const kw = (crit.kw||"").trim().toLowerCase();
  return list.filter(function(e){
    if(crit.type && e.type !== crit.type) return false;
    if(crit.industry && e.industry !== crit.industry) return false;
    if(e.size < (crit.minSize||0)) return false;
    if(e.ret < (crit.minRet!=null?crit.minRet:-1e9)) return false;
    if(e.ret > (crit.maxRet!=null?crit.maxRet:1e9)) return false;
    if(e.fee > (crit.maxFee!=null?crit.maxFee:1e9)) return false;
    if(e.trackErr > (crit.maxTrack!=null?crit.maxTrack:1e9)) return false;
    if(crit.watchOnly && (!watchSet || !watchSet.has(e.code))) return false;
    if(kw && !(e.name.toLowerCase().includes(kw) || e.code.toLowerCase().includes(kw))) return false;
    return true;
  });
}

// 排序：key ∈ ret|size|fee|trackErr|name ；dir ∈ desc|asc
function sortETFs(list, key, dir){
  const arr = list.slice();
  const sign = dir === "asc" ? 1 : -1;
  arr.sort(function(a,b){
    let av, bv;
    if(key === "name"){ av = a.name; bv = b.name; return sign * av.localeCompare(bv,"zh"); }
    av = Number(a[key]||0); bv = Number(b[key]||0);
    if(av !== bv) return sign * (av - bv);
    return a.code.localeCompare(b.code);
  });
  return arr;
}

// 统计汇总
function computeStats(list){
  const n = list.length;
  if(!n) return {count:0,avgRet:null,avgFee:null,best:null,worst:null};
  let sr=0, sf=0, best=list[0], worst=list[0];
  list.forEach(function(e){
    sr += e.ret; sf += e.fee;
    if(e.ret > best.ret) best = e;
    if(e.ret < worst.ret) worst = e;
  });
  return {count:n, avgRet:sr/n, avgFee:sf/n, best:best, worst:worst};
}

// CSV 单元格：防注入 + 逗号/引号/换行处理
function csvCell(v){
  let s = v==null ? "" : String(v);
  if(/^[=+\-@]/.test(s)) s = "'" + s;            // 防公式注入
  if(/[",\n\r]/.test(s)) s = '"' + s.replace(/"/g,'""') + '"';
  return s;
}

function exportCSV(list){
  const head = ["代码","名称","类型","行业","规模(亿)","今年收益(%)","费率(%)","跟踪误差(%)","管理人"];
  const rows = list.map(function(e){
    return [e.code,e.name,e.type,e.industry,e.size,e.ret,e.fee,e.trackErr,e.issuer]
      .map(csvCell).join(",");
  });
  return "﻿" + head.map(csvCell).join(",") + "\n" + rows.join("\n");
}

function exportJSON(list){
  return JSON.stringify({
    exportedAt: new Date().toISOString(),
    count: list.length,
    items: list.map(function(e){ return sanitizeETF(e); })
  }, null, 2);
}

// 自选持久化
function getWatch(){
  try{
    const raw = localStorage.getItem(WATCH_KEY);
    const arr = raw ? JSON.parse(raw) : [];
    return new Set(Array.isArray(arr) ? arr.filter(function(x){return typeof x==="string";}) : []);
  }catch(e){ return new Set(); }
}
function saveWatch(set){
  try{ localStorage.setItem(WATCH_KEY, JSON.stringify(Array.from(set))); }catch(e){}
}

// ---------- 运行时状态 ----------

var curList = [];
var dataSrc = "";
var watch = getWatch();
var compareSel = new Set();
var sortDir = "desc";
var lastSortKey = "ret";

// ---------- 渲染 ----------
function buildRow(e){

  return '<tr>' +
    '<td><input type="checkbox" class="cmp" data-code="'+esc(e.code)+'"'+(cOn?' checked':'')+' aria-label="加入对比 '+esc(e.name)+'"></td>' +
    '<td><button class="star'+wOn+'" data-code="'+esc(e.code)+'" aria-label="'+wAria+'" aria-pressed="'+(wOn?"true":"false")+'">'+ (wOn?"★":"☆") +'</button></td>' +
    '<td>'+esc(e.code)+'</td>' +
    '<td>'+esc(e.name)+'</td>' +
    '<td><span class="pill">'+esc(e.type)+'</span></td>' +
    '<td class="muted">'+esc(e.industry||"-")+'</td>' +
    '<td>'+esc(e.size)+'</td>' +
    '<td class="'+(up?"up":"down")+'">'+(up?"+":"")+e.ret.toFixed(1)+'</td>' +
    '<td>'+e.fee.toFixed(2)+'</td>' +
    '<td>'+e.trackErr.toFixed(2)+'</td>' +
    '<td class="muted">'+esc(e.issuer)+'</td>' +
  '</tr>';
}

function render(){
  const t = document.getElementById("fType").value;
  const ind = document.getElementById("fInd").value;
  const minSize = asNum(document.getElementById("fSize").value, 0);
  const minRet = asNum(document.getElementById("fRetMin").value, -1e9);
  const maxRet = asNum(document.getElementById("fRetMax").value, 1e9);
  const maxFee = asNum(document.getElementById("fFee").value, 1e9);
  const maxTrack = asNum(document.getElementById("fTrack").value, 1e9);
  const kw = (document.getElementById("fKw").value||"").trim();
  const watchOnly = document.getElementById("fWatch").value === "1";

  const crit = {type:t, industry:ind, minSize:minSize, minRet:minRet, maxRet:maxRet,
                maxFee:maxFee, maxTrack:maxTrack, kw:kw, watchOnly:watchOnly};
  let list = filterETFs(ETFS, crit, watch);
  list = sortETFs(list, lastSortKey, sortDir);
  curList = list;

  const body = document.getElementById("body");
  const empty = document.getElementById("empty");
  if(!list.length){
    body.innerHTML = "";
    empty.style.display = "block";
  }else{
    empty.style.display = "none";
    body.innerHTML = list.map(buildRow).join("");
  }

  const st = document.getElementById("stat");
  st.textContent = "数据来源：" + dataSrc + " · 共 " + list.length + " 只符合条件";
  renderBar(list);
  renderCompare();
  updateSortHeaders();
}

function renderBar(list){
  const bar = document.getElementById("bar");
  const s = computeStats(list);
  if(!s.count){ bar.innerHTML = '<span class="muted">无数据</span>'; return; }
  bar.innerHTML =
    '<span>数量 <b>'+s.count+'</b></span>' +
    '<span>平均收益 <b class="'+(s.avgRet>=0?"up":"down")+'">'+(s.avgRet>=0?"+":"")+s.avgRet.toFixed(1)+'%</b></span>' +
    '<span>平均费率 <b>'+s.avgFee.toFixed(2)+'%</b></span>' +
    '<span>最佳 <b class="up">'+esc(s.best.name)+' +'+s.best.ret.toFixed(1)+'%</b></span>' +
    '<span>最差 <b class="down">'+esc(s.worst.name)+' '+s.worst.ret.toFixed(1)+'%</b></span>';
}

function renderCompare(){
  const box = document.getElementById("compare");
  const btn = document.getElementById("cmpBtn");
  btn.textContent = "对比选中 (" + compareSel.size + ")";
  const sel = ETFS.filter(function(e){ return compareSel.has(e.code); });
  if(!sel.length){ box.className = "compare"; box.innerHTML = ""; return; }
  box.className = "compare show";
  const fields = [
    ["类型","type"],["行业","industry"],["规模(亿)","size"],["今年收益(%)","ret"],
    ["费率(%)","fee"],["跟踪误差(%)","trackErr"],["管理人","issuer"]
  ];
  // 数值类最优高亮
  function best(key){ let v=-1e9; sel.forEach(e=>{if(e[key]>v)v=e[key];}); return v; }
  function worst(key){ let v=1e9; sel.forEach(e=>{if(e[key]<v)v=e[key];}); return v; }
  let html = '<table><thead><tr><th scope="col">字段</th>' +
    sel.map(function(e){ return '<th scope="col">'+esc(e.name)+'<br><span class="muted">'+esc(e.code)+'</span></th>'; }).join("") +
    '</tr></thead><tbody>';
  fields.forEach(function(f){
    const key = f[1];
    const b = best(key), w = worst(key);
    html += '<tr><td class="muted">'+f[0]+'</td>' +
      sel.map(function(e){
        let cls = "";
        if(typeof e[key]==="number"){
          if(sel.length>1 && e[key]===b && b!==w) cls=' class="best"';
          else if(sel.length>1 && e[key]===w && b!==w) cls=' class="worst"';
        }
        let val = (key==="ret") ? ((e[key]>=0?"+":"")+e[key].toFixed(1)) :
                  (key==="fee"||key==="trackErr") ? e[key].toFixed(2) : esc(e[key]);
        return '<td'+cls+'>'+val+'</td>';
      }).join("") + '</tr>';
  });
  html += '</tbody></table>';
  box.innerHTML = html;
}

function updateSortHeaders(){
  const ths = document.querySelectorAll("th[data-key]");
  ths.forEach(function(th){
    if(th.getAttribute("data-key")===lastSortKey){
      th.setAttribute("aria-sort", sortDir==="asc"?"ascending":"descending");
      th.className = sortDir==="asc" ? "asc" : "";
    }else{
      th.removeAttribute("aria-sort"); th.className = "";
    }
  });
}

// ---------- 输入校验 ----------
function validateForm(){
  const err = document.getElementById("err");
  let msg = "";
  const lo = asNum(document.getElementById("fRetMin").value, -1e9);
  const hi = asNum(document.getElementById("fRetMax").value, 1e9);
  if(!isFinite(lo)) msg = "最小收益需为数字";
  else if(!isFinite(hi)) msg = "最大收益需为数字";
  else if(lo > hi){ msg = "收益下限不能大于上限，已自动交换"; document.getElementById("fRetMin").value = hi; document.getElementById("fRetMax").value = lo; }
  const fee = asNum(document.getElementById("fFee").value, 1e9);
  if(fee < 0){ msg = "费率不能为负"; document.getElementById("fFee").value = 0; }
  const tr = asNum(document.getElementById("fTrack").value, 1e9);
  if(tr < 0){ msg = "跟踪误差不能为负"; document.getElementById("fTrack").value = 0; }
  err.textContent = msg;
  return true;
}

// ---------- 排序字段点击 ----------
function setupSortHeaders(){
  document.querySelectorAll("th[data-key]").forEach(function(th){
    th.addEventListener("click", function(){
      const key = th.getAttribute("data-key");
      if(key === lastSortKey){ sortDir = sortDir==="asc" ? "desc" : "asc"; }
      else { lastSortKey = key; sortDir = (key==="name") ? "asc" : "desc"; }
      saveFilters(); render();
    });
  });
}

// ---------- 筛选条件持久化 ----------
function saveFilters(){
  try{
    const c = {
      type: document.getElementById("fType").value,
      industry: document.getElementById("fInd").value,
      minSize: document.getElementById("fSize").value,
      retMin: document.getElementById("fRetMin").value,
      retMax: document.getElementById("fRetMax").value,
      fee: document.getElementById("fFee").value,
      track: document.getElementById("fTrack").value,
      kw: document.getElementById("fKw").value,
      watch: document.getElementById("fWatch").value,
      sort: lastSortKey, dir: sortDir
    };
    localStorage.setItem(FILTER_KEY, JSON.stringify(c));
  }catch(e){}
}
function loadFilters(){
  try{
    const raw = localStorage.getItem(FILTER_KEY);
    if(!raw) return;
    const c = JSON.parse(raw);
    if(typeof c.type==="string") document.getElementById("fType").value = c.type;
    refreshIndustryOptions(); // 必须先按类型重建行业选项, 再恢复 industry, 否则选项尚未生成导致丢失
    if(typeof c.industry==="string") document.getElementById("fInd").value = c.industry;
    if(c.minSize!=null) document.getElementById("fSize").value = c.minSize;
    if(c.retMin!=null) document.getElementById("fRetMin").value = c.retMin;
    if(c.retMax!=null) document.getElementById("fRetMax").value = c.retMax;
    if(c.fee!=null) document.getElementById("fFee").value = c.fee;
    if(c.track!=null) document.getElementById("fTrack").value = c.track;
    if(typeof c.kw==="string") document.getElementById("fKw").value = c.kw;
    if(typeof c.watch==="string") document.getElementById("fWatch").value = c.watch;
    if(typeof c.sort==="string") lastSortKey = c.sort;
    if(c.dir==="asc"||c.dir==="desc") sortDir = c.dir;
  }catch(e){}
}

// 行业下拉随类型联动
function refreshIndustryOptions(){
  const t = document.getElementById("fType").value;
  const sel = document.getElementById("fInd");
  const cur = sel.value;
  let opts = ['<option value="">全部</option>'];
  const set = new Set();
  ETFS.forEach(function(e){
    if((!t || e.type===t) && e.industry && !set.has(e.industry)){ set.add(e.industry); opts.push('<option>'+esc(e.industry)+'</option>'); }
  });
  sel.innerHTML = opts.join("");
  if(Array.from(set).indexOf(cur)>=0) sel.value = cur;
}

// ---------- 事件绑定 ----------
function bindEvents(){
  document.getElementById("form").addEventListener("submit", function(ev){
    ev.preventDefault(); validateForm(); saveFilters(); render();
  });
  document.getElementById("fType").addEventListener("change", function(){ refreshIndustryOptions(); saveFilters(); render(); });
  document.getElementById("fInd").addEventListener("change", function(){ saveFilters(); render(); });
  document.getElementById("resetBtn").addEventListener("click", function(){
    ["fType","fInd","fKw","fWatch"].forEach(function(id){ document.getElementById(id).value=""; });
    document.getElementById("fSize").value=0;
    document.getElementById("fRetMin").value=-100;
    document.getElementById("fRetMax").value=1000;
    document.getElementById("fFee").value=100;
    document.getElementById("fTrack").value=100;
    lastSortKey="ret"; sortDir="desc";
    try{ localStorage.removeItem(FILTER_KEY); }catch(e){}
    refreshIndustryOptions(); render();
  });
  document.getElementById("fKw").addEventListener("input", function(){ render(); });
  document.getElementById("exportCsv").addEventListener("click", function(){ doExport("csv"); });
  document.getElementById("exportJson").addEventListener("click", function(){ doExport("json"); });
  document.getElementById("exportWatch").addEventListener("click", function(){ exportSet("watch"); });
  document.getElementById("exportCompare").addEventListener("click", function(){ exportSet("compare"); });
  document.getElementById("cmpBtn").addEventListener("click", function(){ renderCompare(); window.scrollTo({top: document.getElementById("compare").offsetTop-20, behavior:"smooth"}); });
  document.getElementById("clearCmp").addEventListener("click", clearCompare);
  document.getElementById("body").addEventListener("click", function(ev){
    const st = ev.target.closest(".star");
    if(st){ toggleWatch(st.getAttribute("data-code")); return; }
    const cb = ev.target.closest(".cmp");
    if(cb){ const c=cb.getAttribute("data-code"); if(cb.checked) compareSel.add(c); else compareSel.delete(c); renderCompare(); document.getElementById("cmpBtn").textContent="对比选中 ("+compareSel.size+")"; return; }
  });
  setupSortHeaders();
}

function toggleWatch(code){
  if(watch.has(code)) watch.delete(code); else watch.add(code);
  saveWatch(watch); render();
}

// 清空对比选择
function clearCompare(){
  compareSel.clear();
  renderCompare();
  const b = document.getElementById("cmpBtn");
  if(b) b.textContent = "对比选中 (" + compareSel.size + ")";
}

function doExport(kind){
  if(!curList.length){ alert("当前筛选结果为空，无可导出数据"); return; }
  let content, name, type;
  if(kind==="json"){ content=exportJSON(curList); name="ETF筛选结果.json"; type="application/json"; }
  else { content=exportCSV(curList); name="ETF筛选结果.csv"; type="text/csv;charset=utf-8"; }
  const blob = new Blob([content], {type:type});
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob); a.download = name; a.click();
  if(URL.revokeObjectURL) URL.revokeObjectURL(a.href);
}

// 导出目标：当前筛选结果 / 自选 / 对比
function getExportList(source){
  if(source==="watch") return ETFS.filter(function(e){ return watch.has(e.code); });
  if(source==="compare") return ETFS.filter(function(e){ return compareSel.has(e.code); });
  return curList;
}
function buildAndDownload(list, kind, nameBase){
  if(!list.length){ alert("没有可导出的数据"); return; }
  let content, name, type;
  if(kind==="json"){ content=exportJSON(list); name=nameBase+".json"; type="application/json"; }
  else { content=exportCSV(list); name=nameBase+".csv"; type="text/csv;charset=utf-8"; }
  const blob = new Blob([content], {type:type});
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob); a.download = name; a.click();
  if(URL.revokeObjectURL) URL.revokeObjectURL(a.href);
}
function doExport(kind){ buildAndDownload(getExportList("cur"), kind, "ETF筛选结果"); }
function exportSet(source){ buildAndDownload(getExportList(source), "csv", source==="watch"?"ETF自选":"ETF对比"); }
function showFresh(ts,label){const el=document.getElementById("freshness");if(!el)return;el.style.display="block";el.innerHTML="📅 "+(label?label+" ":"")+"更新于 <b>"+ts+"</b>";}

// ---------- 数据加载（后端优先，逐级降级，绝不随机）----------
const API_ROOT = (function(){ try{ return localStorage.getItem("hub_api") || "http://127.0.0.1:8787"; }catch(e){ return "http://127.0.0.1:8787"; } })();
async function loadETFs(){
  const stat = document.getElementById("stat");
  stat.textContent = "加载中…";
  try{
    const ctrl=new AbortController(); setTimeout(()=>ctrl.abort(),8000);
    const r = await fetch((typeof withCache==='function'?withCache(API_ROOT + "/api/etf"):API_ROOT + "/api/etf"), {cache:"no-store",signal:ctrl.signal});
    if(r.ok){
      const j = await r.json();
      if(j && j.ok && Array.isArray(j.rows) && j.rows.length){
        ETFS = j.rows.map(sanitizeETF);
        dataSrc = j.offline ? "离线静态样本(本地 data/etf.json)" : "真实 ETF 行情(akshare)";
        if(j.updated) showFresh(j.updated,"ETF行情");
        refreshIndustryOptions(); loadFilters(); render(); return;
      }
    }
  }catch(e){ console.warn("ETF 接口失败, 用兜底", e); }
  ETFS = FALLBACK_ETFS.map(sanitizeETF);
  dataSrc = "内置兜底样本";
  refreshIndustryOptions(); loadFilters(); render();
}

// ---------- 启动 ----------
if(typeof document !== "undefined" && document.getElementById){
  bindEvents();
  loadETFs();
}
</script>
