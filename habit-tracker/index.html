<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>习惯打卡</title>
<style>
:root{--bg:#0f0f23;--card:#1a1a2e;--card2:#221a3a;--txt:#e6e6f0;--sub:#8a8a9a;--line:#2a2a44;--accent:#667eea;--accent2:#764ba2;--up:#ff4d4f;--down:#00d486;}
*{box-sizing:border-box}
body{margin:0;font-family:system-ui,-apple-system,"Segoe UI",Roboto,"Microsoft YaHei",sans-serif;background:var(--bg);color:var(--txt);line-height:1.6;min-height:100vh}
a{color:var(--txt);text-decoration:none}
.hubhome{position:fixed;top:14px;left:14px;z-index:50;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:8px 12px;font-size:14px;cursor:pointer;box-shadow:0 4px 12px rgba(0,0,0,.4)}
.wrap{max-width:720px;margin:0 auto;padding:70px 16px 40px}
.head{text-align:center;margin-bottom:24px}
.head h1{font-size:26px;margin:0;background:linear-gradient(90deg,var(--accent),var(--accent2));-webkit-background-clip:text;color:transparent}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;margin-bottom:14px}
.inputrow{display:flex;gap:8px;margin-bottom:12px}
.inputrow input{flex:1;background:var(--card2);border:1px solid var(--line);color:var(--txt);padding:10px 12px;border-radius:10px;outline:none}
.btn{background:linear-gradient(90deg,var(--accent),var(--accent2));border:none;color:#fff;padding:10px 18px;border-radius:10px;cursor:pointer;font-weight:600}
.btn.ghost{background:var(--card2);border:1px solid var(--line);color:var(--txt)}
.habit{display:flex;align-items:center;justify-content:space-between;padding:12px;background:var(--card2);border:1px solid var(--line);border-radius:12px;margin-bottom:8px}
.habit .name{font-weight:600}
.habit .streak{font-size:12px;color:var(--sub)}
.habit .check{width:36px;height:36px;border-radius:50%;border:2px solid var(--line);display:grid;place-items:center;cursor:pointer;font-size:18px}
.habit .check.on{background:var(--accent);border-color:var(--accent)}
.heat{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;margin-top:12px}
.heat .cell{aspect-ratio:1;border-radius:4px;background:var(--card2)}
.heat .cell.l0{background:#1a1a2e}
.heat .cell.l1{background:rgba(102,126,234,.3)}
.heat .cell.l2{background:rgba(102,126,234,.6)}
.heat .cell.l3{background:var(--accent)}
.week{display:flex;justify-content:space-between;font-size:11px;color:var(--sub);margin-bottom:4px}
.hubfoot{margin-top:30px;border-top:1px solid var(--line);padding-top:14px;display:flex;justify-content:space-between;font-size:12px;color:var(--sub)}
</style>
</head>
<body>
<a class="hubhome" href="../index.html">🏠 大厅</a>
<div class="wrap">
  <div class="head"><h1>✅ 习惯打卡</h1></div>
  <div class="card">
    <div class="inputrow">
      <input id="habitName" placeholder="输入习惯名称，如 早起 / 阅读 30 分钟">
      <button class="btn" id="addBtn">添加</button>
    </div>
    <div id="habitList"></div>
  </div>
  <div class="card">
    <h3 style="margin:0 0 12px">近 30 天热力图</h3>
    <div class="week"><span>一</span><span>二</span><span>三</span><span>四</span><span>五</span><span>六</span><span>日</span></div>
    <div class="heat" id="heat"></div>
  </div>
  <div class="hubfoot">
    <a href="../index.html">← 返回应用大厅</a>
    <span>数据存 localStorage</span>
  </div>
</div>
<script>
function esc(s){return String(s==null?"":s).replace(/[&<>"']/g,function(c){return({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]);});}
function safeUrl(u){u=String(u==null?"":u);if(/^\s*javascript:/i.test(u))return"#";return esc(u);}

const KEY="habit_data";
let habits=JSON.parse(localStorage.getItem(KEY)||"[]");
function today(){return new Date().toISOString().slice(0,10);}
function save(){localStorage.setItem(KEY,JSON.stringify(habits));render();}
function render(){
  const box=document.getElementById("habitList");
  if(!habits.length){box.innerHTML='<div style="color:var(--sub);text-align:center;padding:20px">还没有习惯，添加一个开始打卡吧</div>';}
  else{box.innerHTML=habits.map((h,i)=>{
    const checked=(h.days||{})[today()];
    const streak=calcStreak(h.days||{});
    return `<div class="habit">
      <div><div class="name">${esc(h.name)}</div><div class="streak">连续 ${streak} 天 · 累计 ${Object.keys(h.days||{}).length} 天</div></div>
      <div style="display:flex;gap:8px;align-items:center">
        <div class="check ${checked?'on':''}" data-i="${i}">${checked?'✓':''}</div>
        <button class="btn ghost" data-del="${i}" style="padding:6px 10px">删</button>
      </div>
    </div>`;
  }).join("");}
  document.querySelectorAll(".check").forEach(c=>c.addEventListener("click",()=>{const i=+c.dataset.i;const d=habits[i].days||{};d[today()]=!d[today()];habits[i].days=d;save();}));
  document.querySelectorAll("[data-del]").forEach(b=>b.addEventListener("click",()=>{if(confirm("确定删除该习惯及其全部打卡记录？")){habits.splice(+b.dataset.del,1);save();}}));
  renderHeat();
}
function calcStreak(days){
  let s=0; const d=new Date(); d.setDate(d.getDate()+1);
  while(true){d.setDate(d.getDate()-1); const k=d.toISOString().slice(0,10); if(days[k])s++; else if(k!==today())break;}
  return s;
}
function renderHeat(){
  const all={}; habits.forEach(h=>Object.assign(all,h.days||{}));
  const box=document.getElementById("heat"); box.innerHTML="";
  const d=new Date(); d.setDate(d.getDate()-29);
  for(let i=0;i<30;i++){
    const k=d.toISOString().slice(0,10); const cnt=habits.reduce((s,h)=>s+((h.days||{})[k]?1:0),0);
    const lv=cnt===0?"l0":cnt<=2?"l1":cnt<=4?"l2":"l3";
    const cell=document.createElement("div"); cell.className="cell "+lv; cell.title=k+" 完成 "+cnt+" 项";
    box.appendChild(cell); d.setDate(d.getDate()+1);
  }
}
document.getElementById("addBtn").addEventListener("click",()=>{
  const v=document.getElementById("habitName").value.trim(); if(!v)return;
  habits.push({name:v,days:{}}); document.getElementById("habitName").value=""; save();
});
render();
</script>
</body>
</html>
