<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>智能条件单 · SmartOrder</title>
<style>
  :root{
    --bg:#0f0f23; --card:#1a1a2e; --line:#2a2a44;
    --up:#ff4d4f; --down:#00d486; --accent:#667eea; --accent2:#764ba2;
    --text:#e8e8f0; --sub:#8a8a9a;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;background:var(--bg);color:var(--text);padding:20px;max-width:1000px;margin:0 auto}
  h1{font-size:24px;background:linear-gradient(90deg,var(--accent),var(--accent2));-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}
  .sub{color:var(--sub);font-size:13px;margin:4px 0 16px}
  .form{display:flex;gap:10px;flex-wrap:wrap;align-items:flex-end;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px;margin-bottom:16px}
  .f{display:flex;flex-direction:column;gap:4px}
  .f label{font-size:11px;color:var(--sub)}
  input,select{background:var(--bg);border:1px solid var(--line);color:var(--text);border-radius:8px;padding:7px 9px;font-family:inherit}
  button{cursor:pointer;border:none;border-radius:8px;padding:8px 14px;background:linear-gradient(90deg,var(--accent),var(--accent2));color:#fff;font-weight:600}
  button.ghost{background:var(--card);border:1px solid var(--line);color:var(--text)}
  table{width:100%;border-collapse:collapse;background:var(--card);border-radius:12px;overflow:hidden}
  th,td{padding:11px 12px;font-size:13px;border-bottom:1px solid var(--line);text-align:left}
  th{color:var(--sub);background:rgba(102,126,234,.08)}
  .trig{font-size:11px;padding:2px 8px;border-radius:99px}
  .trig.on{background:rgba(0,212,134,.15);color:var(--down)}
  .trig.off{background:rgba(138,138,154,.15);color:var(--sub)}
  .log{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px;margin-top:16px;font-size:12px;color:var(--sub);max-height:160px;overflow:auto}
  footer{margin-top:20px;color:var(--sub);font-size:12px;text-align:center}

  .hubfoot{max-width:1180px;margin:30px auto 0;padding:16px;text-align:center;
    font-size:12px;color:var(--sub);border-top:1px solid var(--line);line-height:1.8}
  .hubfoot a{color:var(--g1);text-decoration:none;font-weight:600}
  .hubfoot a:hover{text-decoration:underline}

  .hubhome{position:fixed;top:14px;right:14px;z-index:90;background:linear-gradient(135deg,#667eea,#764ba2);color:#fff;text-decoration:none;border-radius:10px;padding:8px 12px;font-size:13px;font-weight:600;box-shadow:0 4px 14px rgba(124,92,255,.35);transition:filter .15s}
  .hubhome:hover{filter:brightness(1.12)}
</style>
</head>
<body>
<!-- CACHE-WIDGET-START -->
<script type="text/javascript">
(function(){
  window.cacheParams=function(){
    try{
      var ref=document.getElementById("refreshChk");
      if(ref&&ref.checked) return "?refresh=1";
      var t=document.getElementById("ttlSel");
      if(t&&t.value!=="") return "?ttl="+encodeURIComponent(t.value);
    }catch(e){}
    return "";
  };
  window.withCache=function(url){
    var p=window.cacheParams();
    if(!p) return url;
    // p 形如 "?ttl=60" / "?refresh=1"：原 URL 无 ? 时补 ?, 已有 ? 时用 &
    return url+(url.indexOf("?")>=0?"&":"?")+p.slice(1);
  };
  function build(){
    if(document.getElementById("cacheBar"))return;
    var bar=document.createElement("div");
    bar.id="cacheBar";
    bar.innerHTML='<span style="opacity:.8">缓存</span><select id="ttlSel" style="background:#222;color:#eee;border:1px solid #555;border-radius:5px;padding:2px 4px;font-size:12px"><option value="">默认</option><option value="0">强制刷新</option><option value="15">15秒</option><option value="60">1分钟</option><option value="300">5分钟</option><option value="1800">30分钟</option><option value="3600">1小时</option></select><label style="display:flex;align-items:center;gap:3px;font-size:12px"><input type="checkbox" id="refreshChk"> 绕过缓存</label>';
    bar.style.cssText="position:fixed;right:10px;bottom:10px;z-index:9999;background:rgba(18,18,28,.92);color:#ddd;border:1px solid #444;border-radius:9px;padding:6px 9px;font:12px/1.4 system-ui;display:flex;gap:8px;align-items:center;box-shadow:0 3px 10px rgba(0,0,0,.45)";
    document.body.appendChild(bar);
  }
  if(document.readyState==="loading")document.addEventListener("DOMContentLoaded",build);else build();
})();
</script>
<!-- CACHE-WIDGET-END -->
  <a class="hubhome" aria-label="返回 App 大厅" href="../index.html" title="返回 App 大厅">🏠 大厅</a>

<h1>🤖 智能条件单</h1>
<div class="sub">设置「价格触发规则」，到点弹窗提醒（模拟触发，可接真实行情） · 数据源模仿 StockSignal（Y_智能条件单.py）</div>

<div class="form">
  <div class="f"><label>代码</label><input type="text" id="code" placeholder="600519" style="width:90px"></div>
  <div class="f"><label>名称</label><input type="text" id="name" placeholder="贵州茅台" style="width:110px"></div>
  <div class="f"><label>方向</label><select id="dir"><option value="above">涨破</option><option value="below">跌破</option></select></div>
  <div class="f"><label>触发价</label><input type="number" id="trigger" placeholder="1500" style="width:90px"></div>
  <div class="f"><label>动作</label><select id="action"><option value="notify">弹窗提醒</option><option value="sim_buy">模拟买入</option><option value="sim_sell">模拟卖出</option></select></div>
  <div class="f"><label>当前价(模拟)</label><input type="number" id="cur" placeholder="1480" style="width:100px"></div>
  <button id="addBtn">添加条件单</button>
  <button class="ghost" id="simBtn">模拟行情跳变</button>
  <button class="ghost" id="sim10Btn">连续模拟×10</button>
  <button class="ghost" id="realBtn">拉真实行情校验</button>
  <button class="ghost" id="clearLogBtn">清空历史</button>
</div>

<table>
  <thead><tr><th>代码</th><th>名称</th><th>条件</th><th>触发价</th><th>动作</th><th>状态</th><th></th></tr></thead>
  <tbody id="body"></tbody>
</table>
<div class="log" id="log"></div>

<footer>双击即用的零依赖小工具 · 条件单为本地模拟，接真实行情见说明，不构成交易建议</footer>

<script>
let ORDERS=JSON.parse(localStorage.getItem("so_orders")||"[]");
function save(){localStorage.setItem("so_orders",JSON.stringify(ORDERS));}
function add(){
  const code=document.getElementById("code").value.trim();
  const name=document.getElementById("name").value.trim();
  const dir=document.getElementById("dir").value;
  const trigger=parseFloat(document.getElementById("trigger").value);
  const action=document.getElementById("action").value;
  const cur=parseFloat(document.getElementById("cur").value);
  if(!code||isNaN(trigger)){alert("请填代码与触发价");return;}
  ORDERS.push({id:Math.random().toString(36).slice(2,8),code,name,dir,trigger,action,cur:isNaN(cur)?null:cur,triggered:false});
  ["code","name","trigger","cur"].forEach(id=>document.getElementById(id).value="");
  save();render();
}
function del(i){ORDERS.splice(i,1);save();render();}
function check(o){
  if(o.cur===null||o.triggered) return;
  const hit=(o.dir==="above"&&o.cur>=o.trigger)||(o.dir==="below"&&o.cur<=o.trigger);
  if(hit){
    o.triggered=true;
    const msg=`【条件单触发】${o.name||o.code} ${o.dir==="above"?"涨破":"跌破"} ${o.trigger}（现价${o.cur}）→ ${o.action==="notify"?"弹窗提醒":o.action==="sim_buy"?"模拟买入":"模拟卖出"}`;
    pushLog(msg);
    if(Notification.permission==="granted") new Notification("智能条件单触发",{body:msg});
    else if(Notification.permission!=="denied") Notification.requestPermission().then(p=>{if(p==="granted")new Notification("智能条件单触发",{body:msg});});
  }
}
function pushLog(t){
  const el=document.getElementById("log");
  const d=new Date().toLocaleTimeString();
  const line=`[${d}] ${t}`;
  el.innerHTML=`<div>${line}</div>`+el.innerHTML;
  let arr=[];try{arr=JSON.parse(localStorage.getItem("so_log")||"[]")}catch(e){}
  arr.unshift(line); if(arr.length>80)arr=arr.slice(0,80);
  localStorage.setItem("so_log",JSON.stringify(arr));
}
function loadLog(){
  const el=document.getElementById("log");
  let arr=[];try{arr=JSON.parse(localStorage.getItem("so_log")||"[]")}catch(e){}
  el.innerHTML=arr.map(l=>`<div>${l}</div>`).join("")||"<div style='color:var(--sub)'>暂无触发记录</div>";
}
function render(){
  document.getElementById("body").innerHTML=ORDERS.map((o,i)=>{
    const cond=o.dir==="above"?`涨破 ${o.trigger}`:`跌破 ${o.trigger}`;
    const act=o.action==="notify"?"弹窗提醒":o.action==="sim_buy"?"模拟买入":"模拟卖出";
    return `<tr><td>${o.code}</td><td>${o.name||"-"}</td><td>${cond}</td><td>${o.trigger}</td><td>${act}</td><td><span class="trig ${o.triggered?'on':'off'}">${o.triggered?'已触发':'监控中'}</span></td><td><button class="ghost" onclick="del(${i})">删</button></td></tr>`;
  }).join("");
}
// 拉真实行情(akshare/新浪)填充每个条件单的现价, 用于真实校验触发
async function fetchReal(){
  const API_ROOT = localStorage.getItem("hub_api")||"http://127.0.0.1:8787";
  let okCount=0, offlineCount=0, _lastUpd=null;
  for(const o of ORDERS){
    try{
      const _u=API_ROOT+"/api/quote?code="+encodeURIComponent(o.code);
      const r=await fetch((typeof withCache==='function'?withCache(_u):_u),{cache:"no-store"});
      if(r.ok){ const j=await r.json(); if(j.ok && j.price!=null){ o.cur=j.price; o.realName=j.name||o.name; okCount++; if(j.offline) offlineCount++; if(j.updated) _lastUpd=j.updated; check(o); } }
    }catch(e){ console.warn("quote 失败",o.code,e); }
  }
  if(_lastUpd) showFresh(_lastUpd, "行情时间");
  save(); render();
  if(offlineCount>0){
    pushLog(`⚠ 后端离线样本模式：${offlineCount}/${ORDERS.length} 只价格为模拟值（非真实行情），不可用于真实交易触发判断`);
  }
  pushLog(`拉取行情校验完成：${okCount}/${ORDERS.length} 只成功（真实 ${okCount-offlineCount} / 离线模拟 ${offlineCount}）`);
}

// 数据新鲜度徽标（行情时间）：自动挂到状态条/首屏；无 updated 时 no-op 不崩
function showFresh(ts, label){
  if(!ts) return;
  label = label || "行情时间";
  var el = document.getElementById("freshness");
  if(!el){
    el = document.createElement("div");
    el.id = "freshness";
    el.style.cssText = "margin-top:10px;padding:6px 12px;border-radius:10px;font-size:12px;background:rgba(0,212,134,.12);color:#00d486;border:1px solid rgba(0,212,134,.35);";
    var anchor = document.getElementById("status") || document.getElementById("state") || document.getElementById("dataNote");
    if(anchor && anchor.parentNode){ anchor.parentNode.insertBefore(el, anchor.nextSibling); }
    else if(document.body){ document.body.insertBefore(el, document.body.firstChild); }
    else { document.body.appendChild(el); }
  }
  el.style.display = "block";
  el.innerHTML = "📅 " + (label ? label + " " : "") + "更新于 <b>" + ts + "</b>";
}

function simOnce(){
  if(Notification.permission==="default") Notification.requestPermission();
  ORDERS.forEach(o=>{
    if(o.cur===null) o.cur=o.trigger;
    const drift=(Math.random()-0.5)*0.1*o.trigger;
    o.cur=Math.round((o.cur+drift)*100)/100;
    check(o);
  });
}
document.getElementById("addBtn").addEventListener("click",add);
document.getElementById("simBtn").addEventListener("click",()=>{ simOnce(); save();render(); });
document.getElementById("realBtn").addEventListener("click",fetchReal);
document.getElementById("sim10Btn").addEventListener("click",()=>{
  for(let k=0;k<10;k++) simOnce();
  save();render(); pushLog("连续模拟×10 完成");
});
document.getElementById("clearLogBtn").addEventListener("click",()=>{
  localStorage.removeItem("so_log"); document.getElementById("log").innerHTML="<div style='color:var(--sub)'>暂无触发记录</div>";
});
loadLog();
render();
</script>
